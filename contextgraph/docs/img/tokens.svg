<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Prompt tokens with and without Context Graph">
<title>Prompt tokens with and without Context Graph</title>
<rect width="860" height="300" rx="16" fill="#0b0b0d"/>
<text x="24" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ececf1" text-anchor="start">What the model has to read before it sees your question</text><text x="24" y="54" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9aa6" text-anchor="start">A real small model (qwen3:1.7b through Ollama), 40 unseen tasks, 264 tools in the catalog.</text><text x="24" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ececf1" text-anchor="start">All tools preloaded</text><rect x="250" y="90" width="460" height="40" rx="8" fill="#9a9aa6"/><text x="722" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="start">15,522 tokens</text><text x="722" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">1,276 ms per call</text><text x="24" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ececf1" text-anchor="start">Context Graph (after learning)</text><rect x="250" y="160" width="16.0919984538075" height="40" rx="8" fill="#ff5b1f"/><text x="278.0919984538075" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="start">543 tokens</text><text x="278.0919984538075" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">645 ms per call</text><text x="24" y="264" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9aa6" text-anchor="start">The honest part: first tool call was right 37.5% of the time with the graph and 42.5% with everything loaded.</text><text x="24" y="284" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9aa6" text-anchor="start">The measured win is cost and speed, not accuracy.</text>
</svg>
