<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Held-out coverage over training passes">
<title>Held-out coverage over training passes</title>
<rect width="860" height="420" rx="16" fill="#0b0b0d"/>
<text x="96" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ececf1" text-anchor="start">Does it learn? Held-out coverage over training passes</text><text x="96" y="54" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9aa6" text-anchor="start">80 tasks worded differently from anything it trained on. Higher is better.</text><line x1="96" x2="780" y1="350" y2="350" stroke="#2a2a33" stroke-width="1"/><text x="86" y="354" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">40%</text><line x1="96" x2="780" y1="303.33333333333337" y2="303.33333333333337" stroke="#2a2a33" stroke-width="1"/><text x="86" y="307.33333333333337" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">50%</text><line x1="96" x2="780" y1="256.66666666666663" y2="256.66666666666663" stroke="#2a2a33" stroke-width="1"/><text x="86" y="260.66666666666663" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">60%</text><line x1="96" x2="780" y1="210" y2="210" stroke="#2a2a33" stroke-width="1"/><text x="86" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">70%</text><line x1="96" x2="780" y1="163.33333333333331" y2="163.33333333333331" stroke="#2a2a33" stroke-width="1"/><text x="86" y="167.33333333333331" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">80%</text><line x1="96" x2="780" y1="116.66666666666666" y2="116.66666666666666" stroke="#2a2a33" stroke-width="1"/><text x="86" y="120.66666666666666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">90%</text><line x1="96" x2="780" y1="70" y2="70" stroke="#2a2a33" stroke-width="1"/><text x="86" y="74" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">100%</text><line x1="96" x2="780" y1="262.26666666666665" y2="262.26666666666665" stroke="#9a9aa6" stroke-width="2" stroke-dasharray="6 5"/><text x="780" y="278.26666666666665" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="end">keyword search over tools and skills 58.8%</text><line x1="96" x2="780" y1="221.66666666666666" y2="221.66666666666666" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="2 5"/><text x="780" y="237.66666666666666" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5aa9ff" text-anchor="end">keyword index that also learns 67.5%</text><polyline points="96,215.6 232.8,168.93333333333334 369.6,198.33333333333331 506.4,212.33333333333331 643.2,210 780,214.66666666666669" fill="none" stroke="#ff5b1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="96" cy="215.6" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="96" y="203.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">68.8%</text><text x="96" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">before learning</text><circle cx="232.8" cy="168.93333333333334" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="232.8" y="156.93333333333334" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">78.8%</text><text x="232.8" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">after 1 pass</text><circle cx="369.6" cy="198.33333333333331" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="369.6" y="186.33333333333331" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">72.5%</text><text x="369.6" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">after 2 passes</text><circle cx="506.4" cy="212.33333333333331" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="506.4" y="200.33333333333331" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">69.5%</text><text x="506.4" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">after 3 passes</text><circle cx="643.2" cy="210" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="643.2" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">70%</text><text x="643.2" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">after 4 passes</text><circle cx="780" cy="214.66666666666669" r="5" fill="#ff5b1f" stroke="#0b0b0d" stroke-width="2"/><text x="780" y="202.66666666666669" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ececf1" text-anchor="middle">69%</text><text x="780" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">after 5 passes</text><text x="96" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="start">Coverage = every tool the task needs was pulled. Peaks after one pass, then drifts: more passes over the same examples do not help.</text>
</svg>
