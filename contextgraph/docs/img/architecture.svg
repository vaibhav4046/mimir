<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Request flow through the HydraDB graph">
<title>Request flow through the HydraDB graph</title>
<rect width="860" height="360" rx="16" fill="#0b0b0d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a9aa6"/></marker></defs><text x="24" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ececf1" text-anchor="start">How a request flows</text><rect x="24" y="90" width="170" height="70" rx="12" fill="#15151a" stroke="#5aa9ff" stroke-width="2"/><text x="109" y="123" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Your request</text><text x="109" y="143" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">e.g. "refund Acme"</text><rect x="24" y="230" width="170" height="70" rx="12" fill="#15151a" stroke="#37d67a" stroke-width="2"/><text x="109" y="263" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Agent (Mimir)</text><text x="109" y="283" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">offers only the pulled tools</text><rect x="250" y="70" width="586" height="250" rx="16" fill="none" stroke="#ff5b1f" stroke-width="2" stroke-dasharray="6 6"/><text x="268" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ff5b1f" text-anchor="start">A graph stored in HydraDB, on your computer</text><rect x="274" y="130" width="120" height="56" rx="12" fill="#15151a" stroke="#5aa9ff" stroke-width="2"/><text x="334" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Words</text><text x="334" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">refund, Acme</text><rect x="440" y="130" width="120" height="56" rx="12" fill="#15151a" stroke="#ff5b1f" stroke-width="2"/><text x="500" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Skills</text><text x="500" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">issue-refund</text><rect x="606" y="130" width="120" height="56" rx="12" fill="#15151a" stroke="#37d67a" stroke-width="2"/><text x="666" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Tools</text><text x="666" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">stripe__refund</text><rect x="440" y="236" width="286" height="56" rx="12" fill="#15151a" stroke="#9a9aa6" stroke-width="2"/><text x="583" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ececf1" text-anchor="middle">Entities</text><text x="583" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9aa6" text-anchor="middle">Acme resolves to Stripe</text><line x1="394" y1="158" x2="438" y2="158" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="158" x2="604" y2="158" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="236" x2="500" y2="188" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><line x1="666" y1="236" x2="666" y2="188" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><line x1="194" y1="125" x2="272" y2="150" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><line x1="606" y1="190" x2="196" y2="250" stroke="#9a9aa6" stroke-width="2" marker-end="url(#a)"/><text x="398" y="340" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="middle">Learning: when a tool really worked, its links get stronger. No AI model is called to retrieve or to learn.</text><text x="730" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9aa6" text-anchor="start">a few bounded reads</text>
</svg>
